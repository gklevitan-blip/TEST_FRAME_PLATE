<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Палитра титров</title>
<style>
  html { color-scheme: dark; background: #0c0c0c; min-height: 100%; }
  :root {
    --panel-bg: #161616;
    --panel-line: #2e2e2e;
    --ink: #ececec;
    --ink-dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0c0c0c !important;
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    min-height: 100%;
  }

  .halo-text {
    text-shadow: 0 0 4px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.85), 0 0 16px rgba(0,0,0,0.6), 0 2px 3px rgba(0,0,0,0.9);
  }

  /* ---------- STAGE ---------- */
  .stage-wrap {
    padding: 6vh 6vw 4vh;
    background: #0c0c0c;
  }
  .stage {
    border-radius: 0;
    display: block;
    position: relative;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    background-color: #3a3a3a;
    margin: 0 auto;
  }
  .plashka {
    position: absolute;
    border-radius: 6px;
    display: inline-block;
  }
  .stage-title {
    font-weight: 600;
    letter-spacing: 0.01em;
    display: block;
    outline: none;
    text-align: left;
    white-space: nowrap;
  }
  .stage-title:focus {
    box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
    border-radius: 4px;
  }
  .stage-sub {
    position: absolute;
    top: 3%;
    right: 3%;
    font-size: 12px;
    letter-spacing: 0.02em;
    opacity: 0.9;
    color: #fff;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .stage.fs-mode .stage-sub {
    top: auto;
    bottom: 3%;
  }

  /* ---------- LEFT PANEL (frames) ---------- */
  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toggle-row input[type="checkbox"] {
    width: 18px; height: 18px;
  }
  .frame-thumb {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
  }
  .frame-thumb.active {
    border-color: #ececec;
    background: rgba(255,255,255,0.06);
  }
  .frame-thumb img {
    width: 56px;
    height: 32px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .frame-thumb .fname {
    font-size: 12px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .frame-thumb .mark-check {
    width: 18px; height: 18px;
    flex-shrink: 0;
    display: none;
  }
  .frame-thumb.selection-mode .mark-check {
    display: block;
  }

  /* ---------- CONTROLS ---------- */
  .controls {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 22px;
  }
  .control-block {
    flex: 1;
    min-width: 260px;
  }
  .control-block.full-width {
    flex-basis: 100%;
  }
  .control-label {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }
  .swatch-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .mini {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .mini.selected::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 16px 16px 0;
    border-color: transparent var(--corner-color, #fff) transparent transparent;
    filter: drop-shadow(0 0 1.5px var(--corner-halo, rgba(0,0,0,0.9)));
  }
  select {
    appearance: none;
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    width: 100%;
  }
  .num-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .num-field label {
    font-size: 13px;
    color: var(--ink);
    flex: 1;
  }
  .num-field input[type="number"] {
    width: 84px;
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    text-align: right;
  }
  .btn {
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  details.settings-panel {
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 12px 16px;
    background: #121212;
  }
  details.settings-panel summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    padding: 4px 0;
  }
  .settings-grid {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .settings-col { flex: 1; min-width: 240px; }
  .settings-subhead {
    font-size: 12px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 4px 0 10px;
  }

  .rainbow-wrap {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(red, orange, yellow, greenyellow, green, cyan, blue, violet, magenta, red);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .rainbow-wrap input[type="color"] {
    width: 100%;
    height: 100%;
    border: 2px solid #0c0c0c;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: none;
  }
  .rainbow-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .rainbow-wrap input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

  .fs-color-controls {
    display: none;
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 20;
    gap: 16px;
    align-items: flex-start;
  }
  .stage.fs-mode .fs-color-controls {
    display: flex;
  }
  .fs-item {
    position: relative;
  }
  .fs-rect {
    width: 46px;
    height: 32px;
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.55);
    cursor: pointer;
    display: block;
  }
  .fs-label {
    font-size: 11px;
    color: #fff;
    text-align: center;
    margin-top: 5px;
  }
  .fs-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 8px;
    background: rgba(12,12,12,0.94);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px;
    width: 230px;
    z-index: 30;
  }
  .fs-panel.open {
    display: block;
  }
  .fs-panel select {
    width: 100%;
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  .fs-panel .swatch-row {
    margin-top: 10px;
  }
  .fs-panel .rainbow-wrap {
    margin-top: 10px;
  }

  /* ---------- REFERENCE ---------- */
  .reference {
    padding: 2vh 6vw 8vh;
  }
  .section-title {
    font-size: 22px;
    font-weight: 600;
    margin: 40px 0 4px;
    color: #ececec !important;
  }
  .section-sub {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 18px;
  }
  .family-block {
    margin-bottom: 26px;
  }
  .family-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: #ececec !important;
  }
  .family-name .hue-tag {
    font-size: 12px;
    color: var(--ink-dim);
    font-weight: 400;
  }
  .family-strip {
    display: flex;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--panel-line);
  }
  .chip {
    flex: 1;
    min-width: 46px;
    height: 64px;
    position: relative;
    cursor: pointer;
  }
  .chip:hover .chip-tip {
    opacity: 1;
  }
  .chip-tip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    font-size: 11px;
    padding: 4px 7px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
    z-index: 5;
  }

  @media (max-width: 640px) {
    .chip { min-width: 28px; height: 48px; }
  }

  .stage.fs-mode {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-height: none !important;
    border-radius: 0 !important;
    margin: 0 !important;
    z-index: 999;
  }

  .main-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .stage-col {
    flex: 1;
    min-width: 0;
  }
  .left-col {
    width: 180px;
    flex-shrink: 0;
  }
  @media (max-width: 800px) {
    .main-layout { flex-direction: column; }
    .left-col { width: 100%; }
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="main-layout">
    <div class="left-col left-panel">
      <div class="toggle-row">
        <input type="checkbox" id="plashkaEnabledCheck" checked>

      </div>
      <input type="file" id="frameInput" accept="image/*" style="display:none;">
      <button id="addFrameBtn" class="btn">＋ Выбрать файл</button>
      <div style="font-size:11px; color:var(--ink-dim);" id="frameCountLabel">0 / 5 кадров</div>
      <div id="frameGallery" style="margin-top:10px;"></div>
      <button id="showGalleryBtn" class="btn" style="margin-top:10px;">Выбрать</button>
      <button id="deleteMarkedBtn" class="btn" style="display:none; margin-top:8px;">🗑 Удалить</button>
    </div>

              <div class="swatch-row" id="bgFsSwatches"></div>
              <div class="rainbow-wrap" id="bgFsCustomWrap" style="display:none;"><input type="color" id="bgCustomColorFS"></div>
            </div>
          </div>
          <div class="fs-item">
            <button class="fs-rect" id="fgFsRect" type="button"></button>
            <div class="fs-label halo-text">Шрифт</div>
            <div class="fs-panel" id="fgFsPanel">
              <select id="fgFsSelect"></select>
              <div class="swatch-row" id="fgFsSwatches"></div>
              <div class="rainbow-wrap" id="fgFsCustomWrap" style="display:none;"><input type="color" id="fgCustomColorFS"></div>
            </div>
          </div>
        </div>
      </div>
      <div style="text-align:right; margin-top:10px;">
        <button id="openFullscreenBtn" class="btn">⤢ Во весь экран</button>
      </div>

      <div class="controls">
        <div class="control-block">
          <div class="control-label">Плашка</div>
          <select id="bgFamilySelect"></select>
          <div class="swatch-row" id="bgSwatches" style="margin-top:10px;"></div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:26px;">
            <div class="rainbow-wrap"><input type="color" id="bgCustomColor"></div>
            <span style="font-size:12px; color:var(--ink-dim);">или свой цвет</span>
          </div>
          <button id="addToListBtn" class="btn" style="width:100%; margin-top:16px;">＋ Добавить в список ниже</button>
        </div>
        <div class="control-block">
          <div class="control-label">Шрифт</div>
          <select id="fgFamilySelect"></select>
          <div class="swatch-row" id="fgSwatches" style="margin-top:10px;"></div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:26px;">
            <div class="rainbow-wrap"><input type="color" id="fgCustomColor"></div>
            <span style="font-size:12px; color:var(--ink-dim);">или свой цвет</span>
          </div>
        </div>

        <div class="control-block full-width">
          <details class="settings-panel" id="settingsPanel">
            <summary>⚙ Настройки: размер, положение, прозрачность</summary>
            <div class="settings-grid" style="margin-top:14px;">
              <div class="settings-col">
                <div class="settings-subhead">Размер</div>
                <div class="num-field"><label>Шрифт Title, px</label><input type="number" id="titleFontSizeNum" min="10" max="300" step="1"></div>
                <div class="num-field"><label>Шрифт Subtitle, px</label><input type="number" id="subtitleFontSizeNum" min="10" max="300" step="1"></div>
                <div class="num-field"><label>Отступ плашки, %</label><input type="number" id="plashkaPadNum" min="0" max="400" step="1"></div>
                <div class="num-field"><label>Прозрачность плашки, %</label><input type="number" id="plashkaOpacityNum" min="0" max="100" step="1"></div>
              </div>
              <div class="settings-col">
                <div class="settings-subhead">Положение плашки, %</div>
                <div class="num-field"><label>По горизонтали (X)</label><input type="number" id="plashkaPosXNum" min="-20" max="100" step="1"></div>
                <div class="num-field"><label>По вертикали (Y)</label><input type="number" id="plashkaPosYNum" min="-20" max="100" step="1"></div>
              </div>
            </div>
          </details>
        </div>

        <div class="control-block full-width">
          <div class="control-label">Сохранить сочетание</div>
          <button id="copyComboBtn" class="btn" style="width:100%; margin-bottom:8px;">📋 Скопировать текущее</button>
          <textarea id="comboListArea" placeholder="Сюда будут добавляться сохранённые сочетания — можно выделить и скопировать вручную" style="width:100%; height:110px; margin-top:10px; background:var(--panel-bg); color:var(--ink); border:1px solid var(--panel-line); border-radius:8px; padding:8px; font-size:12px; font-family:monospace; resize:vertical;"></textarea>
          <button id="copyAllBtn" class="btn" style="width:100%; margin-top:8px;">📋 Скопировать весь список</button>
          <button id="downloadTxtBtn" class="btn" style="width:100%; margin-top:8px;">⬇ Скачать TXT-файл</button>
          <button id="clearListBtn" class="btn" style="width:100%; margin-top:8px;">🗑 Очистить список сочетаний</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="reference" id="reference">
  <div class="section-title">Справочник</div>
  <div class="section-sub">Все семейства целиком — нажми на плашку, чтобы посмотреть значение</div>
  <div id="allFamilies"></div>
</div>

function hexOf(entry){ return "#" + entry.split(":")[0]; }
function lOf(entry){ return entry.split(":")[1]; }
function hexRaw(entry){ return entry.split(":")[0]; }
function hexToRgb(hex){
  const h = hex.replace("#","");
  return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) };
}

const STORAGE_KEY = "paletteToolSettings_v2";
const MAX_FRAMES = 5;
const DEFAULT_TITLE = "Заголовок или подпись к видеосюжету";

function defaultFrameSettings(fileName, dataURL){
  return {
    id: "f" + Date.now() + Math.random().toString(36).slice(2,7),
    fileName: fileName,
    dataURL: dataURL,
    bgFamily: null, bgIndex: 0, bgCustomHex: "#000000",
    fgFamily: null, fgIndex: 0, fgCustomHex: "#FFFFFF",
    titleFontScale: 48, subtitleFontScale: 48, plashkaScale: 100, plashkaOpacity: 60,
    plashkaPosX: 3, plashkaPosY: 3,
    plashkaEnabled: true,
    titleText: DEFAULT_TITLE
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { frames: [], activeFrameId: null, comboList: "", savedCombos: [] };
    const parsed = JSON.parse(raw);
    return {
      frames: Array.isArray(parsed.frames) ? parsed.frames : [],
      activeFrameId: parsed.activeFrameId || null,
      comboList: parsed.comboList || "",
      savedCombos: Array.isArray(parsed.savedCombos) ? parsed.savedCombos : []
    };
  } catch(e){
    return { frames: [], activeFrameId: null, comboList: "", savedCombos: [] };
  }
}
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      frames: state.frames,
      activeFrameId: state.activeFrameId,
      comboList: state.comboList,
      savedCombos: state.savedCombos
    }));
  } catch(e){ /* quota exceeded etc */ }
}

function isUsingRealFrame(){

function clampIndex(idx, len){
  if (len <= 0) return 0;
  return Math.max(0, Math.min(idx, len-1));
}

function simpleLuma(hex){
  const {r,g,b} = hexToRgb(hex);
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function renderSwatchRow(container, familyName, obj, activeIdx, onPick){
  container.innerHTML = "";
  if (!familyName) return;
  obj[familyName].list.forEach((entry, idx) => {
    const hex = hexOf(entry);
    const div = document.createElement("div");
    div.className = "mini";
    div.style.background = hex;
    if (idx === activeIdx) {
      div.classList.add("selected");
      const light = simpleLuma(hex) > 128;
      div.style.setProperty("--corner-color", light ? "#000000" : "#FFFFFF");
      div.style.setProperty("--corner-halo", light ? "rgba(255,255,255,0.9)" : "rgba(0,0,0,0.9)");
    }
    div.title = hexRaw(entry) + "  L=" + lOf(entry);
    div.onclick = () => onPick(idx);
    container.appendChild(div);
  });
}

function relLum(hex){
  const {r,g,b} = hexToRgb(hex);
  const chan = [r,g,b].map(v => {
    v = v/255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*chan[0] + 0.7152*chan[1] + 0.0722*chan[2];
}
function contrastRatio(hexA, hexB){
  const l1 = relLum(hexA), l2 = relLum(hexB);
  const lighter = Math.max(l1,l2), darker = Math.min(l1,l2);
  return (lighter+0.05)/(darker+0.05);
}

const REFERENCE_STAGE_WIDTH = 1920;

function applySizes(){
  const f = activeFrame();
  const title = document.getElementById("stageTitle");
  const plashka = document.getElementById("plashka");
  const stage = document.getElementById("stage");
  const stageW = stage.clientWidth || REFERENCE_STAGE_WIDTH;
  const scale = stageW / REFERENCE_STAGE_WIDTH;

  const rawFont = f.plashkaEnabled ? f.titleFontScale : f.subtitleFontScale;
  const fontPx = rawFont * scale;
  title.style.fontSize = fontPx + "px";

  const padScale = f.plashkaScale/100;
  const padV = fontPx * 0.5 * padScale;
  const padH = fontPx * 0.75 * padScale;
  plashka.style.padding = padV + "px " + padH + "px";
  plashka.style.left = f.plashkaPosX + "%";
  plashka.style.bottom = f.plashkaPosY + "%";
  plashka.style.right = "auto";
  plashka.style.top = "auto";
}

function applyPlashkaColor(){
  const f = activeFrame();
  const plashka = document.getElementById("plashka");
  const title = document.getElementById("stageTitle");
  if (!f.plashkaEnabled) {
    plashka.style.backgroundColor = "transparent";
    title.style.textShadow =
      "0 0 4px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.85), 0 0 16px rgba(0,0,0,0.6), 0 2px 3px rgba(0,0,0,0.9)";
    return;
  }
  title.style.textShadow = "none";
  const {r,g,b} = hexToRgb(currentBgHex());
  const a = f.plashkaOpacity/100;
  plashka.style.backgroundColor = "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

function sizeStageToImage(dataURL){
  const stage = document.getElementById("stage");
  const wrap = stage.parentElement;
  const img = new Image();
  img.onload = () => {
    const isMobile = window.innerWidth < 640;
    const maxW = wrap.clientWidth;
    const maxH = window.innerHeight * (isMobile ? 0.40 : 0.62);
    let width = maxW;
    let height = width * img.naturalHeight / img.naturalWidth;
    if (height > maxH) { height = maxH; width = height * img.naturalWidth / img.naturalHeight; }
    stage.style.width = Math.round(width) + "px";
    stage.style.height = Math.round(height) + "px";
    applySizes();
  };
  img.src = dataURL;
}

function updateStage(){
  const f = activeFrame();
  const stage = document.getElementById("stage");
  stage.style.backgroundImage = "url(" + f.dataURL + ")";
  sizeStageToImage(f.dataURL);
  applyPlashkaColor();
  document.getElementById("stageTitle").style.color = currentFgHex();
  document.getElementById("stageTitle").textContent = f.titleText;
  document.getElementById("plashkaEnabledCheck").checked = f.plashkaEnabled;

  const fgLine = fgLabel();
  const bgLine = bgLabel();
  const sub = document.getElementById("stageSub");
  if (f.plashkaEnabled) {
    const cr = contrastRatio(currentBgHex(), currentFgHex());
    sub.textContent = bgLine + "  ·  " + fgLine + "  ·  Контр. " + cr.toFixed(1);
  } else {
    sub.textContent = fgLine;
  }
  applySizes();

  document.getElementById("titleFontSizeNum").value = f.titleFontScale;
  document.getElementById("subtitleFontSizeNum").value = f.subtitleFontScale;
  document.getElementById("plashkaPadNum").value = f.plashkaScale;
  document.getElementById("plashkaOpacityNum").value = f.plashkaOpacity;
  document.getElementById("plashkaPosXNum").value = f.plashkaPosX;
  document.getElementById("plashkaPosYNum").value = f.plashkaPosY;

  renderGallery();
}

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(()=>{ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function todayDateStr(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  return dd + "." + mm + "." + yyyy;
}

function formatCombosTxt(){
  if (!state.savedCombos.length) return "";
  const groups = [];
  const byName = {};
  state.savedCombos.forEach(c => {
    if (!byName[c.fileName]) {
      byName[c.fileName] = { fileName: c.fileName, dateStr: c.dateStr, items: [] };
      groups.push(byName[c.fileName]);
    }
    byName[c.fileName].items.push(c);
  });
  return groups.map(g => {
    const header = g.fileName + ", " + g.dateStr;
    const lines = g.items.map(c => {
      const fontPart = "Font - " + c.fontHex.replace("#","").toUpperCase();
      return c.plateHex
        ? ("Plate - " + c.plateHex.replace("#","").toUpperCase() + ", " + fontPart)
        : fontPart;
    });
    return header + "\n" + lines.join("\n");
  }).join("\n\n");
}

async function downloadCombosTxt(){
  const content = formatCombosTxt();
  if (!content) { alert("Список сочетаний пуст — сначала добавьте хотя бы одно сочетание."); return; }
  const fileName = "combos_" + todayDateStr().split(".").reverse().join("-") + ".txt";
  const file = new File([content], fileName, { type: "text/plain" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: fileName });
      return;
    } catch(e) {
      if (e && e.name === "AbortError") return;
      /* share failed for some other reason — fall through to normal download */
    }
  }

  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

let selectionMode = false;

function renderGallery(){
  const gallery = document.getElementById("frameGallery");
  gallery.innerHTML = "";
  state.frames.forEach(fr => {
    const row = document.createElement("div");
    row.className = "frame-thumb" + (fr.id === state.activeFrameId ? " active" : "") + (selectionMode ? " selection-mode" : "");
    const check = document.createElement("input");
    check.type = "checkbox";
    check.className = "mark-check";
    check.checked = markedForDelete.has(fr.id);
    check.addEventListener("click", (e) => {
      e.stopPropagation();
      if (check.checked) markedForDelete.add(fr.id); else markedForDelete.delete(fr.id);
    });
    const img = document.createElement("img");
    img.src = fr.dataURL;
    const name = document.createElement("div");
    name.className = "fname";
    name.textContent = fr.fileName;
    row.appendChild(check);
    row.appendChild(img);
    row.appendChild(name);
    row.addEventListener("click", () => {
      state.activeFrameId = fr.id;
      syncBgUI(); syncFgUI(); updateStage(); saveState();
    });
    gallery.appendChild(row);
  });
  document.getElementById("frameCountLabel").textContent = state.frames.length + " / " + MAX_FRAMES + " кадров";
  document.getElementById("addFrameBtn").disabled = state.frames.length >= MAX_FRAMES;
}

document.getElementById("showGalleryBtn").addEventListener("click", () => {
  selectionMode = !selectionMode;
  document.getElementById("showGalleryBtn").textContent = selectionMode ? "Отмена" : "Выбрать";
  document.getElementById("deleteMarkedBtn").style.display = selectionMode ? "inline-block" : "none";
  if (!selectionMode) markedForDelete.clear();
  renderGallery();
});
document.getElementById("addFrameBtn").addEventListener("click", () => {
  if (state.frames.length >= MAX_FRAMES) return;
  document.getElementById("frameInput").click();
});
document.getElementById("frameInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (state.frames.length >= MAX_FRAMES) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const newFrame = defaultFrameSettings(file.name, ev.target.result);
    state.frames.push(newFrame);
    state.activeFrameId = newFrame.id;
    syncBgUI(); syncFgUI(); updateStage(); saveState();
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});
document.getElementById("deleteMarkedBtn").addEventListener("click", () => {
  if (!markedForDelete.size) return;
  if (!confirm("Удалить отмеченные кадры (" + markedForDelete.size + ")?")) return;
  state.frames = state.frames.filter(fr => !markedForDelete.has(fr.id));
  if (!state.frames.find(fr => fr.id === state.activeFrameId)) {
    state.activeFrameId = state.frames.length ? state.frames[0].id : null;
  }
  markedForDelete.clear();
  selectionMode = false;
  document.getElementById("showGalleryBtn").textContent = "Выбрать";
  document.getElementById("deleteMarkedBtn").style.display = "none";
  syncBgUI(); syncFgUI(); updateStage(); saveState();
});

document.getElementById("fgFsPanel").addEventListener("click", (e) => e.stopPropagation());
document.getElementById("stage").addEventListener("click", () => {
  document.getElementById("bgFsPanel").classList.remove("open");
  document.getElementById("fgFsPanel").classList.remove("open");
});

window.addEventListener('resize', () => { applySizes(); });

/* ---------- init ---------- */
document.getElementById("comboListArea").value = state.comboList || "";
syncBgUI();
syncFgUI();
updateStage();

/* ---------- reference grid ---------- */
function buildReference(){
  const wrap = document.getElementById("allFamilies");

  const textHeader = document.createElement("div");
  textHeader.className = "section-title";
  textHeader.style.fontSize = "16px";
  textHeader.textContent = "Текстовые семейства";
  wrap.appendChild(textHeader);

  Object.keys(DATA.text).forEach(name => {
    wrap.appendChild(familyBlock(name, DATA.text[name]));
  });

  const bgHeader = document.createElement("div");
  bgHeader.className = "section-title";
  bgHeader.style.fontSize = "16px";
  bgHeader.textContent = "Фоновые семейства (плашки)";
  wrap.appendChild(bgHeader);

  Object.keys(DATA.bg).forEach(name => {
    wrap.appendChild(familyBlock(name, DATA.bg[name]));
  });
}

function familyBlock(name, fam){
  const block = document.createElement("div");
  block.className = "family-block";

  const label = document.createElement("div");
  label.className = "family-name";
  label.innerHTML = name + (fam.hue !== null ? ('<span class="hue-tag">hue ' + fam.hue + '°</span>') : '<span class="hue-tag">нейтральный</span>');
  block.appendChild(label);

  const strip = document.createElement("div");
  strip.className = "family-strip";
  fam.list.forEach(entry => {
    const hex = hexOf(entry);
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.style.background = hex;
    const tip = document.createElement("div");
    tip.className = "chip-tip";
    tip.textContent = hexRaw(entry) + "  L=" + lOf(entry);
    chip.appendChild(tip);
    strip.appendChild(chip);
  });
  block.appendChild(strip);
  return block;
}

buildReference();
</script>
