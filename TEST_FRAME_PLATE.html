<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Палитра титров</title>
<link rel="icon" type="image/png" href="icon_test_frame_plate.png">
<link rel="apple-touch-icon" href="icon_test_frame_plate.png">
<meta name="theme-color" content="#17334F">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  html { color-scheme: dark; background: #0c0c0c; min-height: 100%; }
  :root {
    --panel-bg: #161616;
    --panel-line: #2e2e2e;
    --ink: #ececec;
    --ink-dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0c0c0c !important;
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    min-height: 100%;
  }

  .halo-text {
    text-shadow: 0 0 4px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.85), 0 0 16px rgba(0,0,0,0.6), 0 2px 3px rgba(0,0,0,0.9);
  }

  /* ---------- STAGE ---------- */
  .stage-wrap {
    padding: 6vh 6vw 4vh;
    background: #0c0c0c;
  }
  .stage {
    border-radius: 0;
    display: block;
    position: relative;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #3a3a3a;
    margin: 0 auto;
  }
  .plashka {
    position: absolute;
    border-radius: 6px;
    display: inline-block;
  }
  .stage-title {
    font-weight: 600;
    letter-spacing: 0.01em;
    display: block;
    outline: none;
    text-align: left;
    white-space: nowrap;
  }
  .stage-title:focus {
    box-shadow: 0 0 0 2px rgba(255,255,255,0.25);
    border-radius: 4px;
  }
  .stage-sub {
    position: absolute;
    top: 3%;
    right: 3%;
    font-size: 12px;
    letter-spacing: 0.02em;
    opacity: 0.9;
    color: #fff;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .stage.fs-mode .stage-sub {
    top: auto;
    bottom: 0.3%;
  }

  /* ---------- LEFT PANEL (frames) ---------- */
  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toggle-row input[type="checkbox"] {
    width: 18px; height: 18px;
  }
  .frame-thumb {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
  }
  .frame-thumb.active {
    border-color: #ececec;
    background: rgba(255,255,255,0.06);
  }
  .frame-thumb img {
    width: 56px;
    height: 32px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .frame-thumb .fname {
    font-size: 12px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .frame-thumb .mark-check {
    width: 18px; height: 18px;
    flex-shrink: 0;
    display: none;
  }
  .frame-thumb.selection-mode .mark-check {
    display: block;
  }

  /* ---------- CONTROLS ---------- */
  .controls {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 22px;
  }
  .control-block {
    flex: 1;
    min-width: 260px;
  }
  .control-block.full-width {
    flex-basis: 100%;
  }
  .control-label {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }
  .swatch-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .mini {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .mini.selected::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 16px 16px 0;
    border-color: transparent var(--corner-color, #fff) transparent transparent;
    filter: drop-shadow(0 0 1.5px var(--corner-halo, rgba(0,0,0,0.9)));
  }
  select {
    appearance: none;
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    width: 100%;
  }
  .num-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .num-field label {
    font-size: 13px;
    color: var(--ink);
    flex: 1;
  }
  .num-field input[type="number"] {
    width: 84px;
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    text-align: right;
  }
  .btn {
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:active { opacity: 0.7; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  details.settings-panel {
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 12px 16px;
    background: #121212;
  }
  details.settings-panel summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    padding: 4px 0;
  }
  .settings-grid {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .settings-col { flex: 1; min-width: 240px; }
  .settings-subhead {
    font-size: 12px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 4px 0 10px;
  }

  .rainbow-wrap {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(red, orange, yellow, greenyellow, green, cyan, blue, violet, magenta, red);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .rainbow-wrap input[type="color"] {
    width: 100%;
    height: 100%;
    border: 2px solid #0c0c0c;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    background: none;
  }
  .rainbow-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  .rainbow-wrap input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

  .fs-counter {
    display: none;
    position: absolute;
    bottom: 0.3%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-size: 14px;
    color: #fff;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .stage.fs-mode .fs-counter { display: block; }

  .fs-color-controls {
    display: none;
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 20;
    gap: 16px;
    align-items: flex-start;
  }
  .stage.fs-mode .fs-color-controls {
    display: flex;
  }
  .fs-item {
    position: relative;
  }
  .fs-rect {
    width: 46px;
    height: 32px;
    border-radius: 6px;
    border: 2px solid #8a8a8a;
    background-clip: padding-box;
    cursor: pointer;
    display: block;
    position: relative;
    overflow: hidden;
  }
  .fs-rect::after {
    content: "";
    position: absolute;
    top: 2px;
    right: 2px;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 0 0;
    border-color: transparent var(--corner-color, #fff) transparent transparent;
    transition: border-width 0.1s;
  }
  .fs-rect.active::after {
    border-width: 0 var(--corner-size, 14px) var(--corner-size, 14px) 0;
  }
  #fgFsRect { --corner-color: #000000; }
  #bgFsRect { --corner-color: #ffffff; --corner-size: 12px; }
  .fs-label {
    font-size: 11px;
    color: #fff;
    text-align: center;
    margin-top: 5px;
  }
  .fs-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 8px;
    background: rgba(12,12,12,0.94);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px;
    width: 230px;
    z-index: 30;
  }
  .fs-panel.open {
    display: block;
  }
  .fs-panel select {
    width: 100%;
    background: var(--panel-bg);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  .fs-panel .swatch-row {
    margin-top: 10px;
  }
  .fs-panel .rainbow-wrap {
    margin-top: 10px;
  }

  /* ---------- REFERENCE ---------- */
  .reference {
    padding: 2vh 6vw 8vh;
  }
  .section-title {
    font-size: 22px;
    font-weight: 600;
    margin: 40px 0 4px;
    color: #ececec !important;
  }
  .section-sub {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 18px;
  }
  .family-block {
    margin-bottom: 26px;
  }
  .family-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    color: #ececec !important;
  }
  .fam-del {
    margin-left: auto;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    background: var(--panel-bg);
    color: var(--ink);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .fam-del:active { opacity: 0.6; }
  .family-name .hue-tag {
    margin-left: 8px;
    font-size: 12px;
    color: var(--ink-dim);
    font-weight: 400;
  }
  .family-strip {
    display: flex;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--panel-line);
  }
  .chip {
    flex: 1;
    min-width: 46px;
    height: 64px;
    position: relative;
    cursor: pointer;
  }
  .chip:hover .chip-tip {
    opacity: 1;
  }
  .chip-tip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    font-size: 11px;
    padding: 4px 7px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
    z-index: 5;
  }

  @media (max-width: 640px) {
    .chip { min-width: 28px; height: 48px; }
  }

  .stage.fs-mode {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-height: none !important;
    border-radius: 0 !important;
    margin: 0 !important;
    background-size: 100% 100%;
    z-index: 999;
  }

  .main-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .stage-col {
    flex: 1;
    min-width: 0;
  }
  .left-col {
    width: 180px;
    flex-shrink: 0;
  }
  @media (max-width: 800px) {
    .main-layout { flex-direction: column; }
    .left-col { width: 100%; }
  }

  .fam-check {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    margin: 0 0 0 18px;
    cursor: pointer;
    accent-color: #2f7de1;
  }
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%) translateY(-10px);
    background: #2a2d33; color: var(--ink); border: 1px solid var(--panel-line); border-radius: 8px;
    padding: 10px 16px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
    opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 9999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="main-layout">
    <div class="left-col left-panel">
      <div class="toggle-row">
        <input type="checkbox" id="plashkaEnabledCheck" checked>
        <label for="plashkaEnabledCheck" style="font-size:13px;">Плашка</label>
      </div>
      <input type="file" id="frameInput" accept="image/*" style="display:none;">
      <button id="addFrameBtn" class="btn">＋ Выбрать файл</button>
      <div style="font-size:11px; color:var(--ink-dim);" id="frameCountLabel">0 / 5 кадров</div>
      <div id="frameGallery" style="margin-top:10px;"></div>
      <button id="showGalleryBtn" class="btn" style="margin-top:10px;">Выбрать</button>
      <button id="deleteMarkedBtn" class="btn" style="display:none; margin-top:8px;">🗑 Удалить</button>
    </div>

    <div class="stage-col">
      <div class="stage" id="stage">
        <div class="plashka" id="plashka">
          <div class="stage-title" id="stageTitle" contenteditable="true" spellcheck="false"></div>
        </div>
        <div class="stage-sub halo-text" id="stageSub"></div>
        <div id="fsActionsWrap" style="display:none; position:absolute; top:14px; right:14px; z-index:20; flex-direction:column; align-items:flex-end; gap:57px;">
          <button id="closeFullscreenBtn" style="background:rgba(0,0,0,0.55); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;">✕ Свернуть</button>
          <button id="addToListFsBtn" style="background:rgba(0,0,0,0.55); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;">＋ Добавить</button>
        </div>
        <div id="fsCounter" class="fs-counter halo-text"></div>
        <div class="fs-color-controls">
          <div class="fs-item">
            <button class="fs-rect" id="fgFsRect" type="button"></button>
            <div class="fs-label halo-text">Шрифт</div>
            <div class="fs-panel" id="fgFsPanel">
              <select id="fgFsSelect"></select>
              <div class="swatch-row" id="fgFsSwatches"></div>
              <div class="rainbow-wrap" id="fgFsCustomWrap" style="display:none;"><input type="color" id="fgCustomColorFS"></div>
            </div>
          </div>
          <div class="fs-item">
            <button class="fs-rect" id="bgFsRect" type="button"></button>
            <div class="fs-label halo-text">Плашка</div>
            <div class="fs-panel" id="bgFsPanel">
              <select id="bgFsSelect"></select>
              <div class="swatch-row" id="bgFsSwatches"></div>
              <div class="rainbow-wrap" id="bgFsCustomWrap" style="display:none;"><input type="color" id="bgCustomColorFS"></div>
            </div>
          </div>
        </div>
      </div>
      <div style="text-align:right; margin-top:10px;">
        <button id="openFullscreenBtn" class="btn">⤢ Во весь экран</button>
      </div>

      <div class="controls">
        <div class="control-block">
          <div class="control-label">Шрифт</div>
          <select id="fgFamilySelect"></select>
          <div class="swatch-row" id="fgSwatches" style="margin-top:10px;"></div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:26px;">
            <div class="rainbow-wrap"><input type="color" id="fgCustomColor"></div>
            <span style="font-size:12px; color:var(--ink-dim);">или свой цвет</span>
          </div>
        </div>
        <div class="control-block">
          <div class="control-label">Плашка</div>
          <select id="bgFamilySelect"></select>
          <div class="swatch-row" id="bgSwatches" style="margin-top:10px;"></div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:26px;">
            <div class="rainbow-wrap"><input type="color" id="bgCustomColor"></div>
            <span style="font-size:12px; color:var(--ink-dim);">или свой цвет</span>
          </div>
        </div>

        <div class="control-block full-width">
          <button id="addToListBtn" class="btn" style="width:100%;">＋ Добавить в список</button>
        </div>

        <div class="control-block full-width">
          <details class="settings-panel" id="settingsPanel">
            <summary>⚙ Настройки: размер, положение, прозрачность</summary>
            <div class="settings-grid" style="margin-top:14px;">
              <div class="settings-col">
                <div class="settings-subhead">Размер</div>
                <div class="num-field"><label>Шрифт Title, px</label><input type="number" id="titleFontSizeNum" min="10" max="300" step="1"></div>
                <div class="num-field"><label>Шрифт Subtitle, px</label><input type="number" id="subtitleFontSizeNum" min="10" max="300" step="1"></div>
                <div class="num-field"><label>Отступ плашки, %</label><input type="number" id="plashkaPadNum" min="0" max="400" step="1"></div>
                <div class="num-field"><label>Прозрачность плашки, %</label><input type="number" id="plashkaOpacityNum" min="0" max="100" step="1"></div>
              </div>
              <div class="settings-col">
                <div class="settings-subhead">Положение плашки, %</div>
                <div class="num-field"><label>По горизонтали (X)</label><input type="number" id="plashkaPosXNum" min="-20" max="100" step="1"></div>
                <div class="num-field"><label>По вертикали (Y)</label><input type="number" id="plashkaPosYNum" min="-20" max="100" step="1"></div>
              </div>
            </div>
          </details>
        </div>

        <div class="control-block full-width">
          <textarea id="comboListArea" style="width:100%; height:110px; margin-top:0; background:var(--panel-bg); color:var(--ink); border:1px solid var(--panel-line); border-radius:8px; padding:8px; font-size:12px; font-family:monospace; resize:vertical;"></textarea>
          <button id="clearListBtn" class="btn" style="width:100%; margin-top:8px;">🗑 Очистить список сочетаний</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="reference" id="reference">
  <div id="allFamilies"></div>
</div>

<div id="toast" class="toast"></div>

<script>

function hexOf(entry){ return "#" + entry.split(":")[0]; }
function lOf(entry){ return entry.split(":")[1]; }
function hexRaw(entry){ return entry.split(":")[0]; }
function hexToRgb(hex){
  const h = hex.replace("#","");
  return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) };

const STORAGE_KEY = "paletteToolSettings_v2";
const MAX_FRAMES = 5;

const SIZING_KEYS = ["titleFontScale", "subtitleFontScale", "plashkaScale", "plashkaOpacity", "plashkaPosX", "plashkaPosY"];
const SIZING_DEFAULTS_VERSION = 3; // bump this whenever HARDCODED_SIZING_DEFAULTS below changes, to force-apply it once
const HARDCODED_SIZING_DEFAULTS = {
  titleFontScale: 76, subtitleFontScale: 76, plashkaScale: 50, plashkaOpacity: 60,
  plashkaPosX: 3, plashkaPosY: 3
};

function defaultFrameSettings(fileName, dataURL){
  // New frames (and the very first placeholder) start from the last sizing the
  // user actually set, not from hardcoded numbers — so font/plate sizing doesn't
  // appear to "reset" every time a new photo is added.
  const sizing = (typeof state !== "undefined" && state.lastSizing) ? state.lastSizing : HARDCODED_SIZING_DEFAULTS;
  return {
    id: "f" + Date.now() + Math.random().toString(36).slice(2,7),
    fileName: fileName,
    dataURL: dataURL,
    bgFamily: null, bgIndex: 0, bgCustomHex: "#000000",
    fgFamily: null, fgIndex: 0, fgCustomHex: "#FFFFFF",
    titleFontScale: sizing.titleFontScale, subtitleFontScale: sizing.subtitleFontScale,
    plashkaScale: sizing.plashkaScale, plashkaOpacity: sizing.plashkaOpacity,
    plashkaPosX: sizing.plashkaPosX, plashkaPosY: sizing.plashkaPosY,
    plashkaEnabled: true,
    titleText: DEFAULT_TITLE
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { frames: [], activeFrameId: null, comboList: "", savedCombos: [], placeholderSettings: null, lastSizing: null, sizingDefaultsVersion: null };
    const parsed = JSON.parse(raw);
    return {
      frames: Array.isArray(parsed.frames) ? parsed.frames : [],
      activeFrameId: parsed.activeFrameId || null,
      comboList: parsed.comboList || "",
      savedCombos: (Array.isArray(parsed.savedCombos) ? parsed.savedCombos : []).map(normalizeSavedCombo),
      placeholderSettings: parsed.placeholderSettings || null,
      lastSizing: parsed.lastSizing || null,
      sizingDefaultsVersion: parsed.sizingDefaultsVersion || null,
      removed: parsed.removed || null,
      added: parsed.added || null
    };
  } catch(e){
    return { frames: [], activeFrameId: null, comboList: "", savedCombos: [], placeholderSettings: null, lastSizing: null, sizingDefaultsVersion: null };
  }
}
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      frames: state.frames,
      activeFrameId: state.activeFrameId,
      comboList: state.comboList,
      savedCombos: state.savedCombos,
      placeholderSettings: state.placeholderSettings,
      lastSizing: state.lastSizing,
      sizingDefaultsVersion: state.sizingDefaultsVersion,
      removed: state.removed,
      added: state.added
    }));
  } catch(e){ /* quota exceeded etc */ }
}

// SIZING_DEFAULTS_VERSION above). Only touches the "what a NEW/placeholder frame
// starts at" values — never touches sizing already saved on existing photo frames.
if (state.sizingDefaultsVersion !== SIZING_DEFAULTS_VERSION) {
  state.lastSizing = null;
  if (state.placeholderSettings) {
    SIZING_KEYS.forEach(k => { state.placeholderSettings[k] = HARDCODED_SIZING_DEFAULTS[k]; });
  }
  state.sizingDefaultsVersion = SIZING_DEFAULTS_VERSION;
}

// These must be persisted too, or every visit without an active frame reset them to defaults.
if (!state.placeholderSettings) {

function clampIndex(idx, len){

function simpleLuma(hex){
  const {r,g,b} = hexToRgb(hex);
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function renderSwatchRow(container, familyName, obj, activeIdx, onPick){
  container.innerHTML = "";
  if (!familyName) return;
  obj[familyName].list.forEach((entry, idx) => {
    const hex = hexOf(entry);
    const div = document.createElement("div");
    div.className = "mini";
    div.style.background = hex;
    if (idx === activeIdx) {
      div.classList.add("selected");
      const light = simpleLuma(hex) > 128;
      div.style.setProperty("--corner-color", light ? "#000000" : "#FFFFFF");
      div.style.setProperty("--corner-halo", light ? "rgba(255,255,255,0.9)" : "rgba(0,0,0,0.9)");
    }
    div.title = hexRaw(entry) + "  L=" + lOf(entry);
    div.onclick = () => onPick(idx);
    container.appendChild(div);
  });
}

function relLum(hex){
  const {r,g,b} = hexToRgb(hex);
  const chan = [r,g,b].map(v => {
    v = v/255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*chan[0] + 0.7152*chan[1] + 0.0722*chan[2];
}
function contrastRatio(hexA, hexB){
  const l1 = relLum(hexA), l2 = relLum(hexB);
  const lighter = Math.max(l1,l2), darker = Math.min(l1,l2);
  return (lighter+0.05)/(darker+0.05);
}

const REFERENCE_STAGE_WIDTH = 1920;

function applySizes(){
  const f = activeFrame();
  const title = document.getElementById("stageTitle");
  const plashka = document.getElementById("plashka");
  const stage = document.getElementById("stage");
  const stageW = stage.clientWidth || REFERENCE_STAGE_WIDTH;
  const scale = stageW / REFERENCE_STAGE_WIDTH;

  const rawFont = f.plashkaEnabled ? f.titleFontScale : f.subtitleFontScale;
  const fontPx = rawFont * scale;
  title.style.fontSize = fontPx + "px";

  const padScale = f.plashkaScale/100;
  const padV = fontPx * 0.5 * padScale;
  const padH = fontPx * 0.75 * padScale;
  plashka.style.padding = padV + "px " + padH + "px";
  plashka.style.left = f.plashkaPosX + "%";
  plashka.style.bottom = f.plashkaPosY + "%";
  plashka.style.right = "auto";
  plashka.style.top = "auto";
}

function applyPlashkaColor(){
  const f = activeFrame();
  const plashka = document.getElementById("plashka");
  const title = document.getElementById("stageTitle");
  if (!f.plashkaEnabled) {
    plashka.style.backgroundColor = "transparent";
    title.style.textShadow =
      "0 0 4px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.85), 0 0 16px rgba(0,0,0,0.6), 0 2px 3px rgba(0,0,0,0.9)";
    return;
  }
  title.style.textShadow = "none";
  const {r,g,b} = hexToRgb(currentBgHex());
  const a = f.plashkaOpacity/100;
  plashka.style.backgroundColor = "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

function sizeStageToImage(dataURL){
  const stage = document.getElementById("stage");
  const wrap = stage.parentElement;
  const img = new Image();
  img.onload = () => {
    const isMobile = window.innerWidth < 640;
    const maxW = wrap.clientWidth;
    const maxH = window.innerHeight * (isMobile ? 0.40 : 0.62);
    let width = maxW;
    let height = width * img.naturalHeight / img.naturalWidth;
    if (height > maxH) { height = maxH; width = height * img.naturalWidth / img.naturalHeight; }
    stage.style.width = Math.round(width) + "px";
    stage.style.height = Math.round(height) + "px";
    applySizes();
  };
  img.src = dataURL;
}

function updateStage(){
  const f = activeFrame();
  const stage = document.getElementById("stage");
  stage.style.backgroundImage = "url(" + f.dataURL + ")";
  sizeStageToImage(f.dataURL);
  applyPlashkaColor();
  document.getElementById("stageTitle").style.color = currentFgHex();
  document.getElementById("stageTitle").textContent = f.titleText;
  document.getElementById("plashkaEnabledCheck").checked = f.plashkaEnabled;

  const fgLine = fgLabel();
  const bgLine = bgLabel();
  const sub = document.getElementById("stageSub");
  if (f.plashkaEnabled) {
    const cr = contrastRatio(currentBgHex(), currentFgHex());
    sub.textContent = fgLine + "  ·  " + bgLine + "  ·  Контр. " + cr.toFixed(1);
  } else {
    sub.textContent = fgLine;
  }
  applySizes();

  document.getElementById("titleFontSizeNum").value = f.titleFontScale;
  document.getElementById("subtitleFontSizeNum").value = f.subtitleFontScale;
  document.getElementById("plashkaPadNum").value = f.plashkaScale;
  document.getElementById("plashkaOpacityNum").value = f.plashkaOpacity;
  document.getElementById("plashkaPosXNum").value = f.plashkaPosX;
  document.getElementById("plashkaPosYNum").value = f.plashkaPosY;

  renderGallery();
  updateFsNav();
}

/* ---------- flipping frames in fullscreen mode ---------- */
function isFsMode(){
  return document.getElementById("stage").classList.contains("fs-mode");
}
function updateFsNav(){
  const n = state.frames.length;
  const i = state.frames.findIndex(fr => fr.id === state.activeFrameId);
  document.getElementById("fsCounter").textContent = (n > 0 && i >= 0) ? (i + 1) + " / " + n : "";
}
function stepFrame(dir){
  const n = state.frames.length;
  if (n < 2) return;
  let i = state.frames.findIndex(fr => fr.id === state.activeFrameId);
  if (i < 0) i = 0;
  i = (i + dir + n) % n;
  state.activeFrameId = state.frames[i].id;
  document.getElementById("bgFsPanel").classList.remove("open");
  document.getElementById("fgFsPanel").classList.remove("open");
  document.getElementById("bgFsRect").classList.remove("active");
  document.getElementById("fgFsRect").classList.remove("active");
  syncBgUI(); syncFgUI(); updateStage(); saveState();
}
document.addEventListener("keydown", (e) => {
  if (!isFsMode()) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))) return;
  if (e.key === "ArrowLeft")  { e.preventDefault(); stepFrame(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); stepFrame(1); }
});
(function(){
  const stage = document.getElementById("stage");
  let sx = 0, sy = 0, st = 0, tracking = false;
  stage.addEventListener("touchstart", (e) => {
    tracking = false;
    if (!isFsMode() || e.touches.length !== 1) return;
    if (e.target.closest("#stageTitle, .fs-color-controls, #fsActionsWrap")) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
    tracking = true;
  }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy) && Date.now() - st < 800) {
      stepFrame(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

function copyText(text){

}

function colorValueEquals(a, b){

function todayDateStr(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  return dd + "." + mm + "." + yyyy;
}
function nowTimeStr(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mi = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");
  return hh + "-" + mi + "-" + ss;
}

function normalizeSavedCombo(c){
  // migrates entries saved by older versions of this tool (plateHex/fontHex strings)
  if (c.plate !== undefined) return c;
  return {
    fileName: c.fileName,
    dateStr: c.dateStr,
    plate: c.plateHex ? { hex: c.plateHex, family: null, index: null } : null,
    font: { hex: c.fontHex, family: null, index: null }
  };
}

function hexWithFamily(entry){
  const hex = entry.hex.replace("#","").toUpperCase();
  if (entry.family) return hex + "(" + entry.family + ", " + entry.index + ")";
  return hex + "(custom)";
}

function formatCombosTxt(){
  if (!state.savedCombos.length) return "";
  const groups = [];
  const byName = {};
  state.savedCombos.forEach(c => {
    if (!byName[c.fileName]) {
      byName[c.fileName] = { fileName: c.fileName, dateStr: c.dateStr, items: [] };
      groups.push(byName[c.fileName]);
    }
    byName[c.fileName].items.push(c);
  });
  return groups.map(g => {
    const header = g.fileName + ", " + g.dateStr;
    const lines = g.items.map(c => {
      const plateFragment = c.plate ? (", Plate - " + hexWithFamily(c.plate)) : "";
      return "Font - " + hexWithFamily(c.font) + plateFragment;
    });
    return header + "\n\n" + lines.join("\n");
  }).join("\n\n");
}

function outputTxtFileName(){
  // Name the output txt after the currently loaded photo's file name, keeping
  // only the part before its first underscore (e.g. "kadr1_raw.jpg" -> "kadr1.txt").
  const f = activeFrame();
  const raw = f.fileName;
  if (raw) {
    const noExt = raw.replace(/\.[a-zA-Z0-9]+$/, "");
    const base = noExt.split("_")[0];
    if (base) return base + ".txt";
  }
  // Fallback (no photo loaded, e.g. working on the placeholder) — date/time based name.
  return "combos_" + todayDateStr().split(".").reverse().join("-") + "_" + nowTimeStr() + ".txt";
}

let downloadInProgress = false;
async function downloadCombosTxt(){
  if (downloadInProgress) return;
  const content = formatCombosTxt();
  if (!content) { alert("Список сочетаний пуст — сначала добавьте хотя бы одно сочетание."); return; }

  downloadInProgress = true;
  const btn = document.getElementById("downloadTxtBtn");
  btn.disabled = true;
  try {
    const fileName = outputTxtFileName();
    const file = new File([content], fileName, { type: "text/plain" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: fileName });
        return;
      } catch(e) {
        if (e && e.name === "AbortError") return;
        /* share failed for some other reason — fall through to normal download */
      }
    }

    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } finally {
    downloadInProgress = false;
    btn.disabled = false;
  }
}

}
function findFamilyKey(kind, name){
  const K = kindKeys(kind);
  const low = String(name).toLowerCase();
  return Object.keys(DATA[K.data]).find(k => k.toLowerCase() === low) || null;
}
function uniqueFamilyName(kind, base){
  let i = 1;
  while (findFamilyKey(kind, base + "_" + i)) i++;
  return base + "_" + i;
}
function putFamily(kind, name, fam){
  const K = kindKeys(kind);
  DATA[K.data][name] = fam;
  if (!state.added) state.added = { text: {}, bg: {} };
  (state.added[K.data] = state.added[K.data] || {})[name] = fam;
}
function refreshAfterFamilyChange(){
  buildSelects();
  saveState();
  syncBgUI(); syncFgUI(); updateStage();
  buildReference();
}
async function importFamilies(text){
  let p = null;
  try { p = JSON.parse(text); } catch(e){ p = null; }
  if (!p || p.type !== "obojm_to_test" || !Array.isArray(p.families) || (p.kind !== "text" && p.kind !== "bg")){
    await choiceBanner("В буфере нет семейств из Генератора.", [{ label: "OK", value: true }]);
    return;
  }
  let n = 0;
  for (const f of p.families){
    const name = String((f && f.name) || "").trim();
    const list = Array.isArray(f && f.list)
      ? f.list.filter(e => /^[0-9A-Fa-f]{6}:\d+(\.\d+)?$/.test(e)).map(e => e.toUpperCase())
      : [];
    if (!name || !list.length) continue;
    let finalName = name;
    const ex = findFamilyKey(p.kind, name);
    if (ex){
      const ans = await choiceBanner("Семейство «" + ex + "» уже есть.", [
        { label: "Отмена", value: "skip" },
        { label: "Новое имя", value: "new" },
        { label: "Заменить", value: "rep", danger: true }
      ]);
      if (ans === "rep") finalName = ex;
      else if (ans === "new") finalName = uniqueFamilyName(p.kind, name);
      else continue;
    }
    const fam = { hue: Number.isFinite(f.hue) ? f.hue : null, list };
    if (typeof f.params === "string" && f.params.trim()) fam.params = f.params.trim();
    putFamily(p.kind, finalName, fam);
    n++;
  }
  if (n) refreshAfterFamilyChange();
}
async function importFromClipboard(){
  let text = null;
  try { text = await navigator.clipboard.readText(); } catch(e){ text = null; }
  if (text === null){
    text = await inputBanner({ multiline: true, okLabel: "Вставить" });
    if (text === null) return;
  }
  await importFamilies(text);
}
async function renameFamily(kind, oldName){
  const K = kindKeys(kind);
  const typed = await inputBanner({ text: "Новое название", value: oldName, okLabel: "Переименовать" });
  if (typed === null) return;
  const name = typed.trim();
  if (!name || name === oldName) return;
  const ex = findFamilyKey(kind, name);
  const finalName = ex || name;
  if (finalName === oldName) return;
  if (ex){
    const ok = await choiceBanner("Семейство «" + ex + "» будет заменено этим вариантом. Продолжить?", [
      { label: "Отмена", value: false },
      { label: "Заменить", value: true, danger: true }
    ]);
    if (!ok) return;
  }
  const fam = DATA[K.data][oldName];
  if (!fam) return;
  delete DATA[K.data][oldName];
  if (state.added && state.added[K.data]) delete state.added[K.data][oldName];
  const rf = state.removed[K.data].families;
  if (!rf.includes(oldName)) rf.push(oldName);
  putFamily(kind, finalName, fam);
  allFrames().forEach(fr => { if (fr[K.fam] === oldName) fr[K.fam] = finalName; });
  refreshAfterFamilyChange();
}

/* ---------- export selected families to txt (как в Генераторе) ---------- */
const selectedFams = new Set();
function famKey(kind, name){ return kind + "|" + name; }
function allFamKeys(){
  return Object.keys(DATA.text).map(n => famKey("fg", n)).concat(Object.keys(DATA.bg).map(n => famKey("bg", n)));
}
function pruneSelectedFams(){
  const valid = new Set(allFamKeys());
  Array.from(selectedFams).forEach(k => { if (!valid.has(k)) selectedFams.delete(k); });
}
function kindKeys(kind){
  return allFamKeys().filter(k => k.indexOf(kind + "|") === 0);
}
function makeKindSelBtn(kind){
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn";
  b.id = "selectAll_" + kind + "_Btn";
  b.style.cssText = "display:block;width:150px;flex-shrink:0;padding:11px 8px;font-size:13px;white-space:nowrap;";
  b.textContent = kind === "fg" ? "Выбрать все fonts" : "Выбрать все plates";
  b.onclick = () => selectAllKind(kind);
  return b;
}
function selectAllKind(kind){
  const keys = kindKeys(kind);
  if (!keys.length) return;
  const any = keys.some(k => selectedFams.has(k));
  if (any) keys.forEach(k => selectedFams.delete(k)); else keys.forEach(k => selectedFams.add(k));
  syncFamChecks();
}
function updateSelectAllBtn(){
  const btn = document.getElementById("selectAllFamsBtn");
  if (btn){
    const keys = allFamKeys();
    const any = keys.some(k => selectedFams.has(k));
    btn.textContent = any ? "Снять выделения" : "Выделить все";
  }
  ["fg", "bg"].forEach(kind => {
    const b = document.getElementById("selectAll_" + kind + "_Btn");
    if (!b) return;
    const keys = kindKeys(kind);
    const any = keys.some(k => selectedFams.has(k));
    b.textContent = any ? "Снять выделения" : (kind === "fg" ? "Выбрать все fonts" : "Выбрать все plates");
  });
}
function syncFamChecks(){
  document.querySelectorAll(".fam-check").forEach(c => { c.checked = selectedFams.has(c.dataset.key); });
  updateSelectAllBtn();
}
function selectAllFams(){
  const keys = allFamKeys();
  if (!keys.length) return;
  const any = keys.some(k => selectedFams.has(k));
  if (any) selectedFams.clear(); else keys.forEach(k => selectedFams.add(k));
  syncFamChecks();
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

const LAB_Xn = 0.95047, LAB_Yn = 1.0, LAB_Zn = 1.08883;
function srgbToLinear(c){
  c = c / 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function rgbToXyz(r, g, b){
  const rl = srgbToLinear(r), gl = srgbToLinear(g), bl = srgbToLinear(b);
  return [
    0.4124564 * rl + 0.3575761 * gl + 0.1804375 * bl,
    0.2126729 * rl + 0.7151522 * gl + 0.0721750 * bl,
    0.0193339 * rl + 0.1191920 * gl + 0.9503041 * bl
  ];
}
function fLab(t){
  const d = 6 / 29;
  return t > d * d * d ? Math.cbrt(t) : t / (3 * d * d) + 4 / 29;
}
function labC(r, g, b){
  const [X, Y, Z] = rgbToXyz(r, g, b);
  const fx = fLab(X / LAB_Xn), fy = fLab(Y / LAB_Yn), fz = fLab(Z / LAB_Zn);
  const a = 500 * (fx - fy);
  const bb = 200 * (fy - fz);
  return Math.sqrt(a * a + bb * bb);
}
function rowsToText(rows){
  const lw = Math.max(...rows.map(r => ("L=" + r.L).length));
  const cw = Math.max(...rows.map(r => String(Math.round(r.C)).length));
  return rows.map(r => r.hex + "  " + ("L=" + r.L).padEnd(lw) + "  C° " + String(Math.round(r.C)).padStart(cw)).join("\n") + "\n";
}
function famToText(fam){
  const rows = fam.list.map(e => {
    const hex = hexRaw(e).toUpperCase();
    return { hex, L: lOf(e), C: labC(parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)) };
  });
  return rowsToText(rows);
}
function triggerDownload(filename, text){
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function chosenFams(){
  const out = [];
  namesByHue(DATA.text).forEach(n => { if (selectedFams.has(famKey("fg", n))) out.push({ kind: "fg", name: n, fam: DATA.text[n] }); });
  namesByHue(DATA.bg).forEach(n => { if (selectedFams.has(famKey("bg", n))) out.push({ kind: "bg", name: n, fam: DATA.bg[n] }); });
  return out;
}
function zipNameFor(chosen){
  const hasFg = chosen.some(c => c.kind === "fg");
  const hasBg = chosen.some(c => c.kind === "bg");
  return hasFg && hasBg ? "HUE_Font_Plate.zip" : (hasBg ? "HUE_Plate.zip" : "HUE_Font.zip");
}
function afterDownloadSelected(){
  selectedFams.clear();
  syncFamChecks();
}
function safeFileName(s){
  return String(s).replace(/[\\\/:*?"<>|]+/g, "_").trim();
}
function exportBaseName(c){
  const kindWord = c.kind === "bg" ? "plate" : "font";
  let tail = safeFileName(c.name || "");
  if (!tail){
    tail = (c.fam && c.fam.hue !== null && c.fam.hue !== undefined) ? String(c.fam.hue) : "neutral";
  }
  return "HUE_" + kindWord + "_" + tail;
}
function downloadSelectedTxt(){
  pruneSelectedFams();
  const chosen = chosenFams();
  if (!chosen.length){ showToast("Ничего не отмечено."); return; }

  const nFg = chosen.filter(c => c.kind === "fg").length;
  const nBg = chosen.filter(c => c.kind === "bg").length;

  if (nFg === 1 && nBg === 1){
    showToast("Надо снять одну из двух галок.");
    return;
  }

  // Одно семейство — просто txt без папок и архива.
  if (chosen.length === 1){
    chosen.forEach(c => triggerDownload(exportBaseName(c) + ".txt", famToText(c.fam)));
    afterDownloadSelected();
    return;
  }

  if (typeof JSZip === "undefined"){
    // Нет сети / библиотека не загрузилась — fallback на отдельные файлы.
    chosen.forEach(c => triggerDownload(exportBaseName(c) + ".txt", famToText(c.fam)));
    afterDownloadSelected();
    return;
  }

  // Тип, где семейств больше одного — папка; где одно — файл в корне архива.
  const zip = new JSZip();
  const folders = {
    fg: nFg > 1 ? zip.folder("HUE_FONTS") : null,
    bg: nBg > 1 ? zip.folder("HUE_Plates") : null
  };
  const usedNames = {};
  chosen.forEach(c => {
    if (!folders[c.kind]){
      zip.file(exportBaseName(c) + ".txt", famToText(c.fam));
      return;
    }
    let base = safeFileName(c.name || "") || String(c.fam.hue !== null ? c.fam.hue : "neutral");
    let name = base + ".txt";
    const uKey = c.kind + "|" + name;
    if (usedNames[uKey] !== undefined){
      usedNames[uKey]++;
      name = base + "_" + usedNames[uKey] + ".txt";
    } else {
      usedNames[uKey] = 0;
    }
    folders[c.kind].file(name, famToText(c.fam));
  });

  zip.generateAsync({ type: "blob" }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = zipNameFor(chosen);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    afterDownloadSelected();
  }).catch(e => {
    console.error("Не удалось создать zip:", e);
    showToast("Ошибка при создании архива.");
  });
}

/* ---------- выделения не запоминаются: сбрасываются любым другим действием и при закрытии ---------- */
function clearAllSelections(){
  if (!selectedFams.size) return;
  selectedFams.clear();
  syncFamChecks();
}
(function(){
  const KEEP_IDS = ["selectAllFamsBtn", "selectAll_fg_Btn", "selectAll_bg_Btn", "exportFamsBtn"];
  function onAnyAction(e){
    const t = e.target;
    if (!t || !t.closest) return;
    if (t.closest(".fam-check")) return;
    if (KEEP_IDS.some(id => t.closest("#" + id))) return;
    const inFams = t.closest("#allFamilies");
    if (inFams && !t.closest("button,input,select,textarea,a,summary,label")) return;
    clearAllSelections();
  }
  ["click", "input", "change"].forEach(ev => document.addEventListener(ev, onAnyAction, true));
  window.addEventListener("pagehide", () => selectedFams.clear());
  window.addEventListener("pageshow", e => { if (e.persisted) clearAllSelections(); });
})();

buildReference();
</script>
